<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LoreLens">
  <!-- Branch graph seen through a lens: the plugin's own lane colours. -->
  <g stroke-linecap="round" fill="none">
    <!-- lanes running behind the lens -->
    <path d="M 20 46 H 200" stroke="#548AF7" stroke-width="4" opacity="0.9"/>
    <path d="M 20 70 H 200" stroke="#6FA85A" stroke-width="4" opacity="0.9"/>
    <path d="M 20 94 H 132" stroke="#B07DD8" stroke-width="4" opacity="0.9"/>
    <!-- the merge: purple lane curves into green -->
    <path d="M 132 94 Q 148 94 148 82 Q 148 70 164 70" stroke="#B07DD8" stroke-width="4" opacity="0.9"/>
  </g>
  <!-- nodes -->
  <g stroke="none">
    <circle cx="52" cy="46" r="7" fill="#548AF7"/>
    <circle cx="96" cy="70" r="7" fill="#6FA85A"/>
    <circle cx="76" cy="94" r="7" fill="#B07DD8"/>
    <!-- merge node: donut -->
    <circle cx="164" cy="70" r="8" fill="#6FA85A"/>
    <circle cx="164" cy="70" r="3.5" fill="#818B98" opacity="0.25"/>
  </g>
  <!-- the lens, ringed white-on-dark / slate-on-light -->
  <g fill="none" stroke="#818B98" stroke-width="6" stroke-linecap="round">
    <circle cx="140" cy="66" r="44"/>
    <path d="M 172 96 L 198 122"/>
  </g>
  <!-- the current-revision ring inside the lens: what the white ring means -->
  <circle cx="120" cy="46" r="11" fill="none" stroke="#818B98" stroke-width="3"/>
  <circle cx="120" cy="46" r="7" fill="#548AF7"/>
  <!-- wordmark -->
  <text x="232" y="82" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="650" fill="#818B98" letter-spacing="-1">Lore<tspan fill="#548AF7">Lens</tspan></text>
</svg>
